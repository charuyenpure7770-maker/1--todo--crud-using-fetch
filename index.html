<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>todo crud by using(fetch)</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
   <div class="container">
     <div class="row mt-5">
        <div class="col-md-6">
         <form id="form">
            <div class="card shadow">
                <div class="card-header header">
                    <h3>Todo List</h3>
                </div>
                <div class="card-body">
                    <label for="todo">Add Todo</label>
                    <input type="text" class="form-control" id="todo" placeholder="Enter todo" required>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" class="btn btn-outline-primary btn-sm" id="submitBtn">Add Todo</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm d-none" id="updateBtn">Update Todo</button>
                </div>
                </form>
            </div>
        </div>
        <div class="col-md-6">
                <div class="card shadow">
                <ul class="list-group" id="list">
                    <!-- <li class="list-group-item d-flex justify-content-between">
                      <strong>HTML</strong>
                       <div >
                        <i class="fa-solid fa-pen-to-square fa-2x text-primary"></i>
                        <i class="fa-solid fa-trash fa-2x text-danger"></i>
                       </div>
                    </li>     -->
                </ul>
                </div>
                </div>
     </div>
     <div class="spinner d-none" id="spinner">
  <div class= "spinner-border" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>
   </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
